<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percepta Carousel Builder</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- استيراد خطوط عربية متنوعة من Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #0b0f17;
      color: #e2e8f0;
    }

    /* خطوط ديناميكية */
    .font-tajawal { font-family: 'Tajawal', sans-serif; }
    .font-cairo { font-family: 'Cairo', sans-serif; }
    .font-almarai { font-family: 'Almarai', sans-serif; }

    /* الثيمات والستايلات البصرية */
    .theme-cyber {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #ffffff;
      border: 1px solid #30363d;
    }
    .theme-cyber .accent { color: #6366f1; }
    .theme-cyber .badge { background: #6366f1; color: #fff; }

    .theme-minimal {
      background-color: #fafafa;
      color: #111827;
      border: 1px solid #e5e7eb;
    }
    .theme-minimal .accent { color: #000000; }
    .theme-minimal .badge { background: #111827; color: #fff; }

    .theme-emerald {
      background: linear-gradient(145deg, #064e3b 0%, #022c22 100%);
      color: #ecfdf5;
      border: 1px solid #059669;
    }
    .theme-emerald .accent { color: #34d399; }
    .theme-emerald .badge { background: #34d399; color: #064e3b; }

    .theme-sunset {
      background: linear-gradient(135deg, #2e1065 0%, #0f172a 100%);
      color: #f8fafc;
      border: 1px solid #7c3aed;
    }
    .theme-sunset .accent { color: #f43f5e; }
    .theme-sunset .badge { background: #f43f5e; color: #fff; }

    /* أشكال ديكورية في الخلفية */
    .decor-circle {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.25;
      pointer-events: none;
    }
  </style>
</head>
<body class="p-4 md:p-8 max-w-xl mx-auto pb-12">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6 border-b border-slate-800 pb-4">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></div>
      <h1 class="text-xl font-black tracking-wider text-white">PERCEPTA CAROUSEL</h1>
    </div>
    <span class="bg-indigo-500/10 text-indigo-400 text-xs font-bold px-3 py-1 rounded-full border border-indigo-500/20">v2.0 Custom</span>
  </div>

  <!-- عناصر التحكم -->
  <div class="space-y-4">
    
    <!-- معرّف الحساب -->
    <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
      <label class="block text-xs font-bold text-slate-400 mb-2">معرّف الحساب الخاص بك</label>
      <input type="text" id="handleInput" value="@percepta_pr" 
        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-center text-indigo-400 font-bold focus:outline-none focus:border-indigo-500 transition">
    </div>

    <!-- اختيار نوع الخط -->
    <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
      <label class="block text-xs font-bold text-slate-400 mb-2">اختر الخط العربي</label>
      <select id="fontSelect" onchange="renderSlides()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
        <option value="font-tajawal">خط تجوال (Tajawal) - هندسي وحديث</option>
        <option value="font-cairo">خط القاهرة (Cairo) - بارز وقوي للمحتوى</option>
        <option value="font-almarai">خط المراعي (Almarai) - ناعم واحترافي</option>
      </select>
    </div>

    <!-- المحتوى -->
    <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
      <label class="block text-xs font-bold text-slate-400 mb-2">محتوى الكاروسيل</label>
      <textarea id="contentText" rows="6" 
        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition leading-relaxed"
        placeholder="اكتب المحتوى هنا..."></textarea>
      <p class="text-[11px] text-slate-500 mt-2">
        💡 الفصل بين الشرائح: اترك سطراً فارغاً (Enter مرتين).
      </p>
    </div>

    <!-- الثيمات البصرية -->
    <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
      <label class="block text-xs font-bold text-slate-400 mb-3">ستايل التصميم والألوان</label>
      <div class="grid grid-cols-2 gap-2 text-xs font-bold">
        <button onclick="setTheme('theme-cyber')" class="p-3 rounded-lg border border-slate-700 bg-slate-900 text-white flex items-center justify-center gap-2">
          <span class="w-3 h-3 rounded-full bg-indigo-500"></span> سايبر ساكن
        </button>
        <button onclick="setTheme('theme-minimal')" class="p-3 rounded-lg border border-slate-300 bg-white text-black flex items-center justify-center gap-2">
          <span class="w-3 h-3 rounded-full bg-black"></span> مينيمليست هادئ
        </button>
        <button onclick="setTheme('theme-emerald')" class="p-3 rounded-lg border border-emerald-600 bg-emerald-950 text-emerald-200 flex items-center justify-center gap-2">
          <span class="w-3 h-3 rounded-full bg-emerald-400"></span> زمردي فاخر
        </button>
        <button onclick="setTheme('theme-sunset')" class="p-3 rounded-lg border border-purple-700 bg-purple-950 text-white flex items-center justify-center gap-2">
          <span class="w-3 h-3 rounded-full bg-rose-500"></span> غروب التدرج
        </button>
      </div>
    </div>

    <!-- زر التوليد -->
    <button onclick="renderSlides()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/20 text-base">
      توليد الكاروسيل بالستايل الجديد ✨
    </button>
  </div>

  <!-- قسم المعاينة -->
  <div class="mt-8">
    <div class="flex items-center justify-between mb-4">
      <span class="text-xs text-slate-400">المعاينة الحية</span>
      <span id="slidesCount" class="text-xs font-bold text-indigo-400">0 شرائح</span>
    </div>

    <div id="slidesContainer" class="flex gap-4 overflow-x-auto pb-6 snap-x snap-mandatory">
      <!-- الشرائح تتولد هنا -->
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const defaultContent = `كيف تبني هوية بصرية تلفت الانتباه؟

1. البساطة والتوازن:
لا تملأ المساحة بكل التفاصيل، دع للتصميم متنفساً يريح العين.

2. اختيار الخطوط المقروءة:
الخط الواضح يضمن وصول فكرتك بسرعة على شاشات الموبايل.

إذا أعجبك هذا المحتوى، احفظ البوست وشاركه مع مهتمي التصميم!`;

    let currentTheme = 'theme-cyber';
    document.getElementById('contentText').value = defaultContent;

    function setTheme(theme) {
      currentTheme = theme;
      renderSlides();
    }

    function renderSlides() {
      const handle = document.getElementById('handleInput').value || '@Percepta';
      const selectedFont = document.getElementById('fontSelect').value;
      const rawText = document.getElementById('contentText').value;
      const container = document.getElementById('slidesContainer');
      
      const slidesData = rawText.split(/\n\s*\n/).filter(slide => slide.trim() !== '');
      document.getElementById('slidesCount').innerText = `${slidesData.length} شرائح`;
      container.innerHTML = '';

      slidesData.forEach((slideContent, index) => {
        const isCover = index === 0;
        const totalSlides = slidesData.length;
        
        const slideWrapper = document.createElement('div');
        slideWrapper.className = 'flex-shrink-0 snap-center flex flex-col items-center gap-3';
        
        slideWrapper.innerHTML = `
          <!-- تصميم الشريحة باشتراط أبعاد 1:1 وأشكال هندسية -->
          <div id="slide-${index}" class="${currentTheme} ${selectedFont} w-[300px] h-[300px] p-6 rounded-2xl flex flex-col justify-between shadow-xl relative overflow-hidden transition-all">
            
            <!-- دوائر خلفية ديكورية -->
            <div class="decor-circle bg-indigo-500 top-0 right-0"></div>
            <div class="decor-circle bg-rose-500 bottom-0 left-0"></div>

            <!-- Header الشريحة -->
            <div class="flex justify-between items-center text-[11px] font-bold z-10">
              <span class="opacity-80 flex items-center gap-1">
                <svg class="w-3 h-3 accent fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                ${handle}
              </span>
              <span class="badge px-2 py-0.5 rounded-full text-[10px] font-black">${index + 1}/${totalSlides}</span>
            </div>

            <!-- Body المحتوى -->
            <div class="my-auto z-10">
              ${isCover ? `
                <div class="inline-flex items-center gap-1 text-[10px] font-bold accent mb-2">
                  <span>اسحب لمعرفة المزيد</span>
                  <svg class="w-3 h-3 fill-current rotate-180" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
              ` : ''}
              <p class="${isCover ? 'text-lg font-black leading-snug' : 'text-xs leading-relaxed opacity-90'} whitespace-pre-line">
                ${slideContent}
              </p>
            </div>

            <!-- Footer الشريحة -->
            <div class="flex justify-between items-center text-[9px] opacity-60 font-bold border-t border-current/10 pt-2 z-10">
              <span>Percepta Studio</span>
              <span>${isCover ? '• Swipe ➔' : 'Save post 📌'}</span>
            </div>
          </div>

          <!-- زر التحميل -->
          <button onclick="downloadSlide(${index})" class="w-full bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 text-xs font-bold py-2 px-4 rounded-xl flex items-center justify-center gap-2 transition">
            تحميل الشريحة (${index + 1}) 📥
          </button>
        `;

        container.appendChild(slideWrapper);
      });
    }

    function downloadSlide(index) {
      const slideElement = document.getElementById(`slide-${index}`);
      html2canvas(slideElement, { scale: 3, useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = `percepta-slide-${index + 1}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    renderSlides();
  </script>
</body>
</html>
