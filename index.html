<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel Studio - المحرر الاحترافي</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- استيراد خطوط عربية وأجنبية احترافية -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background-color: #0f1115;
      color: #e2e8f0;
    }

    /* الخطوط */
    .font-ibm { font-family: 'IBM Plex Sans Arabic', sans-serif; }
    .font-cairo { font-family: 'Cairo', sans-serif; }
    .font-tajawal { font-family: 'Tajawal', sans-serif; }
    .font-inter { font-family: 'Inter', sans-serif; }
    .font-playfair { font-family: 'Playfair Display', serif; }

    /* ستايلات تايبوغرافي بشرية (Editorial Styles) */
    .style-swiss {
      background-color: #ffffff;
      color: #111111;
      border: 1px solid #e5e5e5;
    }
    .style-swiss .handle-tag { color: #666666; font-weight: 600; }
    .style-swiss .divider { border-color: #eeeeee; }

    .style-monochrome {
      background-color: #121212;
      color: #f5f5f5;
      border: 1px solid #2a2a2a;
    }
    .style-monochrome .handle-tag { color: #a1a1aa; font-weight: 600; }
    .style-monochrome .divider { border-color: #27272a; }

    .style-warm-paper {
      background-color: #fbf9f5;
      color: #2c2a29;
      border: 1px solid #e8e4dc;
    }
    .style-warm-paper .handle-tag { color: #8c827a; font-weight: 600; }
    .style-warm-paper .divider { border-color: #eae5dc; }

    .style-slate-clean {
      background-color: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
    }
    .style-slate-clean .handle-tag { color: #94a3b8; font-weight: 600; }
    .style-slate-clean .divider { border-color: #334155; }

    /* صندوق التحرير المباشر */
    #editorArea:focus {
      outline: none;
    }
  </style>
</head>
<body class="p-4 md:p-8 max-w-xl mx-auto pb-16">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6 border-b border-zinc-800 pb-4">
    <h1 class="text-lg font-bold tracking-tight text-white">CAROUSEL STUDIO</h1>
    <span class="text-xs text-zinc-400 font-mono">v3.0 Editor</span>
  </div>

  <!-- عناصر التحكم -->
  <div class="space-y-4">
    
    <!-- 1. معرّف الحساب -->
    <div class="bg-zinc-900/80 p-4 rounded-xl border border-zinc-800">
      <label class="block text-xs font-bold text-zinc-400 mb-2">معرّف الحساب (يظهر في الهيدر والفوتر)</label>
      <input type="text" id="handleInput" value="أبو حميد" oninput="renderSlides()"
        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-center text-zinc-200 font-bold focus:outline-none focus:border-zinc-500 transition">
    </div>

    <!-- 2. الخطوط وحجم الخط -->
    <div class="grid grid-cols-2 gap-3 bg-zinc-900/80 p-4 rounded-xl border border-zinc-800">
      <div>
        <label class="block text-xs font-bold text-zinc-400 mb-2">الخط المستعمل</label>
        <select id="fontSelect" onchange="renderSlides()" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-zinc-200 focus:outline-none">
          <option value="font-ibm">عربي: IBM Plex (حديث)</option>
          <option value="font-cairo">عربي: القاهرة (بارز)</option>
          <option value="font-tajawal">عربي: تجوال (هندسي)</option>
          <option value="font-inter">إنجليزي/عربي: Inter</option>
          <option value="font-playfair">إنجليزي: Playfair (كلاسيك)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-zinc-400 mb-2">حجم خط المحتوى</label>
        <select id="fontSizeSelect" onchange="renderSlides()" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-zinc-200 focus:outline-none">
          <option value="text-xs">صغير (12px)</option>
          <option value="text-sm" selected>متوسط (14px)</option>
          <option value="text-base">كبير (16px)</option>
          <option value="text-lg">كبير جداً (18px)</option>
        </select>
      </div>
    </div>

    <!-- 3. محرر النصوص المصغر (Rich Text Editor) -->
    <div class="bg-zinc-900/80 p-4 rounded-xl border border-zinc-800">
      <label class="block text-xs font-bold text-zinc-400 mb-2">محتوى الكاروسيل وتنسيقه</label>
      
      <!-- شريط أدوات التنسيق -->
      <div class="flex items-center gap-1 bg-zinc-950 p-1.5 rounded-t-lg border border-zinc-800 border-b-0 text-xs">
        <button onclick="execCmd('bold')" title="عريض" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 rounded font-bold">B</button>
        <button onclick="execCmd('italic')" title="مائل" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 rounded italic">I</button>
        <button onclick="execCmd('underline')" title="تحته خط" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 rounded underline">U</button>
        <div class="h-4 w-[1px] bg-zinc-800 mx-1"></div>
        <button onclick="execCmd('justifyRight')" title="يمين" class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 rounded">➡️</button>
        <button onclick="execCmd('justifyCenter')" title="وسط" class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 rounded">↔️</button>
        <button onclick="execCmd('justifyLeft')" title="يسار" class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 rounded">⬅️</button>
      </div>

      <!-- منطقة التحرير القابلة للتنسيق -->
      <div id="editorArea" contenteditable="true" oninput="renderSlides()"
        class="w-full min-h-[140px] bg-zinc-950 border border-zinc-800 rounded-b-lg p-3 text-sm text-zinc-200 focus:outline-none leading-relaxed overflow-y-auto">
      </div>
      
      <p class="text-[11px] text-zinc-500 mt-2">
        💡 اترك سطراً فارغاً (ضغط Enter مرتين) للفصل بين كل شريحة وأخرى.
      </p>
    </div>

    <!-- 4. ستايلات التصميم التحريري -->
    <div class="bg-zinc-900/80 p-4 rounded-xl border border-zinc-800">
      <label class="block text-xs font-bold text-zinc-400 mb-3">ستايل التصميم (Minimal Human Styles)</label>
      <div class="grid grid-cols-2 gap-2 text-xs font-bold">
        <button onclick="setStyle('style-swiss')" class="p-3 rounded-lg border border-zinc-300 bg-white text-black flex items-center justify-center gap-2">
          <span class="w-3 h-3 rounded-full bg-black"></span> سويسري نظيف (أبيض)
        </button>
        <button onclick="setStyle('style-monochrome')" class="p-3 rounded-lg border border-zinc-700 bg-zinc-900 text-white flex items-center justify-center gap-2">
          <span class="w-3 h-3 rounded-full bg-zinc-500"></span> مونوكروم دافئ
        </button>
        <button onclick="setStyle('style-warm-paper')" class="p-3 rounded-lg border border-amber-200 bg-[#fbf9f5] text-amber-950 flex items-center justify-center gap-2">
          <span class="w-3 h-3 rounded-full bg-amber-700"></span> ورقي كلاسيكي
        </button>
        <button onclick="setStyle('style-slate-clean')" class="p-3 rounded-lg border border-slate-700 bg-slate-900 text-slate-100 flex items-center justify-center gap-2">
          <span class="w-3 h-3 rounded-full bg-slate-400"></span> رمادي كحلي
        </button>
      </div>
    </div>

    <!-- زر تحديث -->
    <button onclick="renderSlides()" class="w-full bg-zinc-100 hover:bg-white text-black font-bold py-3 rounded-xl transition text-sm">
      تحديث التغييرات والمعاينة ⚡
    </button>
  </div>

  <!-- قسم المعاينة -->
  <div class="mt-8">
    <div class="flex items-center justify-between mb-4">
      <span class="text-xs text-zinc-400">المعاينة المباشرة</span>
      <span id="slidesCount" class="text-xs font-bold text-zinc-300">0 شرائح</span>
    </div>

    <div id="slidesContainer" class="flex gap-4 overflow-x-auto pb-6 snap-x snap-mandatory">
      <!-- الشرائح تتولد هنا -->
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const defaultHTML = `الخط الجيد يرفع من قيمة محتواك البصري بنسبة 80% على شبكات التواصل.

تجنب المبالغة في الزخارف، واعتمد التوازن والمساحات الفارغة المريحة لعين المشاهد.

إذا أعجبك هذا المحتوى، احفظ البوست للرجوع إليه لاحقاً وشاركه مع صديق مهتم!`;

    let currentStyle = 'style-swiss';

    // تعيين المحتوى الافتراضي في المحرر
    const editor = document.getElementById('editorArea');
    editor.innerText = defaultHTML;

    // دالة تنفيذ أزرار التنسيق (Bold, Italic, Alignment)
    function execCmd(command) {
      document.execCommand(command, false, null);
      renderSlides();
    }

    function setStyle(styleClass) {
      currentStyle = styleClass;
      renderSlides();
    }

    function renderSlides() {
      const handle = document.getElementById('handleInput').value || '@Username';
      const selectedFont = document.getElementById('fontSelect').value;
      const selectedFontSize = document.getElementById('fontSizeSelect').value;
      const container = document.getElementById('slidesContainer');
      
      // قراءة المحتوى المعالج وتقسيمه بناءً على أسطر الفصل
      const contentHTML = editor.innerHTML;
      
      // تفكيك الشرائح بحسب التقسيمات
      
      const tempDiv = document.createElement('div');
tempDiv.innerHTML = contentHTML;
const rawSlides = tempDiv.innerHTML.split(/<div><br\b[^>]*>|<\/div><div>|<br\s*\/?>\s*<br\s*\/?>/gi);

      const slidesData = rawSlides.filter(slide => slide.replace(/<[^>]*>/g, '').trim() !== '');

      document.getElementById('slidesCount').innerText = `${slidesData.length} شرائح`;
      container.innerHTML = '';

      slidesData.forEach((slideHTML, index) => {
        const totalSlides = slidesData.length;
        
        const slideWrapper = document.createElement('div');
        slideWrapper.className = 'flex-shrink-0 snap-center flex flex-col items-center gap-3';
        
        slideWrapper.innerHTML = `
          <!-- تصميم الشريحة المربعة 1:1 بدون تعقيدات ذكاء اصطناعي -->
          <div id="slide-${index}" class="${currentStyle} ${selectedFont} w-[300px] h-[300px] p-6 rounded-xl flex flex-col justify-between relative overflow-hidden transition-all">
            
            <!-- Header الشريحة -->
            <div class="flex justify-between items-center text-[10px] handle-tag">
              <span>${handle}</span>
              <span class="opacity-60">${index + 1}/${totalSlides}</span>
            </div>

            <!-- Body النص بمرونة وبدون تصغير للكلمة الأولى -->
            <div class="my-auto w-full">
              <div class="${selectedFontSize} leading-relaxed font-normal">
                ${slideHTML}
              </div>
            </div>

            <!-- Footer الشريحة يحتوي اسم الحساب المعين فقط -->
            <div class="flex justify-between items-center text-[10px] handle-tag pt-3 border-t divider">
              <span>${handle}</span>
              <span class="opacity-50">Swipe ➔</span>
            </div>
          </div>

          <!-- زر التحميل -->
          <button onclick="downloadSlide(${index})" class="w-full bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 text-xs font-bold py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition">
            تحميل الشريحة (${index + 1}) 📥
          </button>
        `;

        container.appendChild(slideWrapper);
      });
    }

        
    function downloadSlide(index) {
      const slideElement = document.getElementById(`slide-${index}`);
      // التقاط لون الخلفية الفعلي للشريحة لمنع أي إطار أبيض
      const computedBg = window.getComputedStyle(slideElement).backgroundColor;

      html2canvas(slideElement, { 
        scale: 3, 
        useCORS: true,
        backgroundColor: computedBg 
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `slide-${index + 1}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // التوليد الأولي
    renderSlides();
  </script>
</body>
</html>
